name: Deploy API to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - circuit_reader.py
      - backend/**
      - results/*.json
      - results/*.csv
      - requirements.txt
      - space/**
      - .github/workflows/space.yml

permissions:
  contents: read

concurrency:
  group: space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SPACE_ID: Fogued/circuit-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==0.36.2
      - name: Assemble the Space build context
        run: |
          mkdir -p ctx/results
          cp space/Dockerfile space/README.md circuit_reader.py requirements.txt ctx/
          cp backend/requirements.txt ctx/backend-requirements.txt
          cp -r backend ctx/backend
          rm -rf ctx/backend/tests
          find ctx -name __pycache__ -prune -exec rm -rf {} +
          cp results/*.json results/*.csv ctx/results/
          find ctx -type f | sort
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="ctx",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["*"],
          )
          print(f"https://huggingface.co/spaces/{space}")
          EOF
