[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-reader"
version = "1.0.0"
description = "Read component values from circuit-diagram images (YOLO detector + TrOCR reader)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
full = ["ultralytics==8.4.182", "transformers==4.57.6", "torch==2.11.0", "opencv-python==4.14.0.94", "pillow==13.0.0"]

[tool.setuptools]
py-modules = ["circuit_reader"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]
